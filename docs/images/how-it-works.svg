<svg width="1280" height="380" viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How NadirClaw works: Route, Verify, Escalate">
  <title>How NadirClaw works — Route, Verify, Escalate</title>
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
      .sans  { font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }
      .lbl   { font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; letter-spacing: .2em; }
    </style>
    <g id="spark2">
      <line x1="0" y1="-13" x2="0" y2="13"/><line x1="-13" y1="0" x2="13" y2="0"/>
      <line x1="-7.5" y1="-7.5" x2="7.5" y2="7.5"/><line x1="-7.5" y1="7.5" x2="7.5" y2="-7.5"/>
    </g>
  </defs>

  <rect width="1280" height="380" fill="#F4F1EA"/>

  <!-- header -->
  <use href="#spark2" transform="translate(80 44) scale(0.5)" stroke="#C75D3A" stroke-width="2.4"/>
  <text class="lbl sans" x="100" y="49" font-size="13" fill="#1E2A44">HOW NADIRCLAW WORKS</text>
  <line x1="80" y1="66" x2="1200" y2="66" stroke="#E3DACA" stroke-width="1.4"/>

  <!-- dividers -->
  <line x1="454" y1="96" x2="454" y2="340" stroke="#E3DACA" stroke-width="1.4"/>
  <line x1="856" y1="96" x2="856" y2="340" stroke="#E3DACA" stroke-width="1.4"/>

  <!-- ========= 01 ROUTE ========= -->
  <text class="serif" x="80" y="158" font-size="62" fill="#C75D3A">01</text>
  <text class="lbl sans" x="190" y="138" font-size="15" fill="#1E2A44">ROUTE</text>
  <text class="serif" x="190" y="166" font-size="15.5" font-style="italic" fill="#B06A4B">start low</text>
  <text class="serif" x="80" y="218" font-size="17.5" fill="#4A4636">Predict the smallest model likely to</text>
  <text class="serif" x="80" y="244" font-size="17.5" fill="#4A4636">answer, and try that one first.</text>
  <!-- motif: dots -> circles -> filled -->
  <line x1="96" y1="300" x2="392" y2="300" stroke="#C9C0AE" stroke-width="1.4" stroke-dasharray="1 7" stroke-linecap="round"/>
  <circle cx="96"  cy="300" r="2.6" fill="#1E2A44"/>
  <circle cx="118" cy="300" r="2.6" fill="#1E2A44"/>
  <circle cx="140" cy="300" r="2.6" fill="#1E2A44"/>
  <circle cx="196" cy="300" r="8" fill="none" stroke="#1E2A44" stroke-width="1.7"/>
  <circle cx="252" cy="300" r="8" fill="none" stroke="#1E2A44" stroke-width="1.7"/>
  <circle cx="312" cy="300" r="8" fill="none" stroke="#1E2A44" stroke-width="1.7"/>
  <circle cx="380" cy="300" r="11" fill="#C75D3A"/>

  <!-- ========= 02 VERIFY ========= -->
  <text class="serif" x="482" y="158" font-size="62" fill="#7FA0C8">02</text>
  <text class="lbl sans" x="592" y="138" font-size="15" fill="#1E2A44">VERIFY</text>
  <text class="serif" x="592" y="166" font-size="15.5" font-style="italic" fill="#6E86A8">quality first</text>
  <text class="serif" x="482" y="218" font-size="17.5" fill="#4A4636">Score the answer against quality</text>
  <text class="serif" x="482" y="244" font-size="17.5" fill="#4A4636">heuristics before it ships.</text>
  <!-- motif: receipt card with check -->
  <rect x="482" y="272" width="150" height="58" rx="8" fill="#FBFAF5" stroke="#D9CFBE" stroke-width="1.5"/>
  <line x1="498" y1="290" x2="588" y2="290" stroke="#E3DACA" stroke-width="1.4"/>
  <line x1="498" y1="304" x2="572" y2="304" stroke="#E3DACA" stroke-width="1.4"/>
  <line x1="498" y1="316" x2="556" y2="316" stroke="#E3DACA" stroke-width="1.4"/>
  <circle cx="612" cy="312" r="14" fill="#7FA0C8"/>
  <path d="M605 312 l5 5 l9 -10" fill="none" stroke="#FBFAF5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ========= 03 ESCALATE ========= -->
  <text class="serif" x="884" y="158" font-size="62" fill="#1E2A44">03</text>
  <text class="lbl sans" x="994" y="138" font-size="15" fill="#1E2A44">ESCALATE</text>
  <text class="serif" x="994" y="166" font-size="15.5" font-style="italic" fill="#B06A4B">only if needed</text>
  <text class="serif" x="884" y="218" font-size="17.5" fill="#4A4636">If it falls short, step up to the</text>
  <text class="serif" x="884" y="244" font-size="17.5" fill="#4A4636">next-best model — automatically.</text>
  <!-- motif: ascending steps -->
  <g stroke="#1E2A44" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M884 322 h36 v-22 h36 v-22 h36 v-22 h36"/>
  </g>
  <use href="#spark2" transform="translate(1052 252) scale(0.42)" stroke="#C75D3A" stroke-width="2.6"/>
  <path d="M1010 300 l30 -26" stroke="#C75D3A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-dasharray="2 5"/>
</svg>
