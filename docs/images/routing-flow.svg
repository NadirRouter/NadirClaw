<svg width="1280" height="460" viewBox="0 0 1280 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Routing intelligence — how a prompt is classified">
  <title>Routing intelligence — how NadirClaw classifies a prompt</title>
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
      .sans  { font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }
      .mono  { font-family: 'SF Mono', 'JetBrains Mono', Menlo, 'DejaVu Sans Mono', monospace; }
      .lbl   { font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; letter-spacing: .2em; }
    </style>
    <g id="spark4">
      <line x1="0" y1="-13" x2="0" y2="13"/><line x1="-13" y1="0" x2="13" y2="0"/>
      <line x1="-7.5" y1="-7.5" x2="7.5" y2="7.5"/><line x1="-7.5" y1="7.5" x2="7.5" y2="-7.5"/>
    </g>
    <path id="cstar4" d="M0,-15 L3.4,-3.4 L15,0 L3.4,3.4 L0,15 L-3.4,3.4 L-15,0 L-3.4,-3.4 Z"/>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9A927F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="#F4F1EA"/>

  <use href="#spark4" transform="translate(80 44) scale(0.5)" stroke="#C75D3A" stroke-width="2.4"/>
  <text class="lbl sans" x="100" y="49" font-size="13" fill="#1E2A44">ROUTING INTELLIGENCE — HOW A PROMPT IS CLASSIFIED</text>
  <line x1="80" y1="66" x2="1200" y2="66" stroke="#E3DACA" stroke-width="1.4"/>

  <!-- PROMPT SPECIMEN -->
  <rect x="64" y="156" width="220" height="150" rx="12" fill="#FBFAF5" stroke="#E3DACA" stroke-width="1.5"/>
  <text class="lbl sans" x="84" y="186" font-size="10.5" fill="#8A8270">PROMPT SPECIMEN</text>
  <line x1="84" y1="198" x2="264" y2="198" stroke="#E3DACA" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text class="serif" x="84" y="230" font-size="19" fill="#1E2A44">“now add tests</text>
  <text class="serif" x="84" y="256" font-size="19" fill="#1E2A44">for the auth module”</text>
  <text class="mono" x="84" y="290" font-size="12.5" fill="#9A927F">9 turns · 3 tools</text>

  <!-- arrow to classifier -->
  <line x1="292" y1="231" x2="348" y2="231" stroke="#9A927F" stroke-width="1.5" stroke-dasharray="1 6" marker-end="url(#arr)"/>

  <!-- CLASSIFIER seal -->
  <circle cx="424" cy="231" r="46" fill="#FBFAF5" stroke="#1E2A44" stroke-width="1.6"/>
  <circle cx="424" cy="231" r="38" fill="none" stroke="#E3DACA" stroke-width="1.2"/>
  <use href="#cstar4" transform="translate(424 222) scale(0.78)" fill="#C75D3A"/>
  <text class="mono" x="424" y="252" font-size="12" fill="#1E2A44" text-anchor="middle">~10ms</text>
  <text class="lbl sans" x="424" y="306" font-size="10.5" fill="#1E2A44" text-anchor="middle">CLASSIFIER</text>
  <text class="serif" x="424" y="328" font-size="14" font-style="italic" fill="#6B6456" text-anchor="middle">embedding centroid</text>

  <!-- modifiers row -->
  <text class="lbl sans" x="520" y="120" font-size="10.5" fill="#8A8270">ROUTING MODIFIERS — CAN OVERRIDE THE SCORE</text>
  <g class="sans" font-size="13" fill="#1E2A44">
    <rect x="520" y="134" width="92"  height="30" rx="15" fill="#F6E6DC" stroke="#E0BCA9" stroke-width="1.2"/>
    <text x="566" y="154" text-anchor="middle">agentic</text>
    <rect x="624" y="134" width="106" height="30" rx="15" fill="#FBFAF5" stroke="#D9CFBE" stroke-width="1.2"/>
    <text x="677" y="154" text-anchor="middle">reasoning</text>
    <rect x="742" y="134" width="84"  height="30" rx="15" fill="#FBFAF5" stroke="#D9CFBE" stroke-width="1.2"/>
    <text x="784" y="154" text-anchor="middle">vision</text>
    <rect x="838" y="134" width="120" height="30" rx="15" fill="#FBFAF5" stroke="#D9CFBE" stroke-width="1.2"/>
    <text x="898" y="154" text-anchor="middle">long context</text>
  </g>
  <!-- agentic override pushes the marker -->
  <line x1="566" y1="166" x2="566" y2="206" stroke="#C75D3A" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arr)"/>

  <!-- score axis -->
  <line x1="500" y1="231" x2="952" y2="231" stroke="#1E2A44" stroke-width="2" stroke-linecap="round"/>
  <!-- zone divider ticks -->
  <line x1="650" y1="222" x2="650" y2="240" stroke="#9A927F" stroke-width="1.4"/>
  <line x1="800" y1="222" x2="800" y2="240" stroke="#9A927F" stroke-width="1.4"/>
  <text class="mono" x="500" y="262" font-size="12" fill="#9A927F">0.0</text>
  <text class="mono" x="952" y="262" font-size="12" fill="#9A927F" text-anchor="end">1.0</text>
  <text class="lbl sans" x="575" y="218" font-size="10" fill="#8C9A6E" text-anchor="middle">SIMPLE</text>
  <text class="lbl sans" x="725" y="218" font-size="10" fill="#7FA0C8" text-anchor="middle">MID</text>
  <text class="lbl sans" x="876" y="218" font-size="10" fill="#C75D3A" text-anchor="middle">COMPLEX</text>
  <!-- marker -->
  <circle cx="892" cy="231" r="9" fill="#C75D3A"/>
  <text class="mono" x="892" y="290" font-size="13" fill="#1E2A44" text-anchor="middle">score 0.91</text>
  <text class="serif" x="892" y="312" font-size="13.5" font-style="italic" fill="#B06A4B" text-anchor="middle">tools → forced complex</text>
  <line x1="892" y1="222" x2="892" y2="270" stroke="#C75D3A" stroke-width="1.3" stroke-dasharray="2 4"/>

  <!-- arrow to tiers -->
  <line x1="962" y1="231" x2="1000" y2="231" stroke="#9A927F" stroke-width="1.5" stroke-dasharray="1 6" marker-end="url(#arr)"/>

  <!-- tier cards -->
  <g opacity="0.45">
    <rect x="1012" y="150" width="200" height="46" rx="10" fill="#FBFAF5" stroke="#D9CFBE" stroke-width="1.4"/>
    <text class="lbl sans" x="1028" y="170" font-size="10" fill="#1E2A44">SIMPLE</text>
    <text class="serif" x="1028" y="187" font-size="15" fill="#1E2A44">gemini-flash</text>
  </g>
  <g opacity="0.45">
    <rect x="1012" y="208" width="200" height="46" rx="10" fill="#FBFAF5" stroke="#D9CFBE" stroke-width="1.4"/>
    <text class="lbl sans" x="1028" y="228" font-size="10" fill="#1E2A44">MID</text>
    <text class="serif" x="1028" y="245" font-size="15" fill="#1E2A44">haiku-4.5</text>
  </g>
  <rect x="1012" y="266" width="200" height="46" rx="10" fill="#F6E6DC" stroke="#C75D3A" stroke-width="1.6"/>
  <text class="lbl sans" x="1028" y="286" font-size="10" fill="#C75D3A">COMPLEX  ✓</text>
  <text class="serif" x="1028" y="303" font-size="15" font-weight="700" fill="#1E2A44">sonnet-4.6</text>
</svg>
