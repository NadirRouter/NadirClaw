site_name: NadirClaw Documentation
site_url: https://nadirclaw.com/docs
site_description: Open-source LLM router — simple prompts to cheap models, complex to premium
repo_url: https://github.com/NadirRouter/NadirClaw
repo_name: NadirRouter/NadirClaw

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - Configuration: configuration.md
  - API Reference: api.md
  - CLI Reference: cli.md
  - How Routing Works: routing.md
  - Context Optimization: context-optimize.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

plugins:
  - search
